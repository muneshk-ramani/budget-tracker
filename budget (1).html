<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simple Budget Tracker</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#1a1d23; --muted:#6b7280;
    --accent:#1f4e78; --accent-light:#e8f0f7; --border:#e2e5ea;
    --green:#1a7f4e; --red:#c0392b; --income:#1f8a4c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161a; --card:#1e2126; --text:#e8e9ec; --muted:#9aa0aa;
      --accent:#5b9bd5; --accent-light:#25344a; --border:#2c3038;
      --green:#3ecf8e; --red:#e6685f; --income:#4fce8a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --card:#1e2126; --text:#e8e9ec; --muted:#9aa0aa;
    --accent:#5b9bd5; --accent-light:#25344a; --border:#2c3038;
    --green:#3ecf8e; --red:#e6685f; --income:#4fce8a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px; margin:0 auto; padding:28px 18px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:12px;}
  h1{font-size:1.4rem; margin:0; letter-spacing:-0.02em;}
  .sub{color:var(--muted); font-size:0.85rem; margin-top:4px;}
  .theme-btn{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:8px 12px; cursor:pointer; font-size:0.85rem;
  }
  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
  @media (max-width:700px){.cards{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:420px){.cards{grid-template-columns:1fr;}}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; text-align:left;
  }
  .card .label{color:var(--muted); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em;}
  .card .value{font-size:1.5rem; font-weight:700; margin-top:6px;}
  .card.income .value{color:var(--income);}
  .card.expense .value{color:var(--red);}
  .card.remaining .value.pos{color:var(--green);}
  .card.remaining .value.neg{color:var(--red);}
  .card.receivable .value{color:var(--accent);}
  .row.receivable-row{grid-template-columns: 1fr 100px 100px 90px 34px;}
  .row.receivable-row select{
    border:1px solid var(--border); background:var(--card); color:var(--text);
    border-radius:8px; padding:8px; font-size:0.82rem; width:100%;
  }
  .row.receivable-row input[type=date]{
    border:1px solid var(--border); background:transparent; color:var(--text);
    border-radius:8px; padding:8px 6px; font-size:0.8rem; width:100%;
  }
  @media (max-width:640px){
    .row.receivable-row{grid-template-columns: 1fr 90px 34px; }
    .row.receivable-row .dateField{display:none;}
  }

  section.panel{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px; margin-bottom:18px;
  }
  .panel h2{font-size:1rem; margin:0 0 12px;}
  .row{
    display:grid; grid-template-columns: 1fr 110px 34px; gap:8px; align-items:center;
    margin-bottom:8px;
  }
  .row input[type=text]{
    border:1px solid var(--border); background:transparent; color:var(--text);
    border-radius:8px; padding:9px 10px; font-size:0.9rem; width:100%;
  }
  .row input[type=number]{
    border:1px solid var(--border); background:transparent; color:var(--text);
    border-radius:8px; padding:9px 8px; font-size:0.9rem; width:100%; text-align:right;
  }
  .row button.del{
    background:none; border:none; color:var(--muted); font-size:1.1rem; cursor:pointer;
    padding:4px;
  }
  .row button.del:hover{color:var(--red);}
  .add-btn{
    background:var(--accent-light); color:var(--accent); border:none; border-radius:8px;
    padding:9px 14px; font-size:0.85rem; cursor:pointer; font-weight:600; margin-top:4px;
  }
  .section-total{
    display:flex; justify-content:space-between; font-weight:700; margin-top:10px;
    padding-top:10px; border-top:1px solid var(--border); font-size:0.95rem;
  }
  footer{color:var(--muted); font-size:0.75rem; text-align:center; margin-top:20px;}
  .reset-btn{
    background:none; border:1px solid var(--border); color:var(--muted);
    border-radius:8px; padding:6px 12px; font-size:0.78rem; cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>💰 Simple Budget</h1>
      <div class="sub">Your data stays on this device</div>
    </div>
    <button class="theme-btn" id="themeToggle">🌓</button>
  </header>

  <div class="cards">
    <div class="card income">
      <div class="label">Income</div>
      <div class="value" id="totalIncome">0</div>
    </div>
    <div class="card expense">
      <div class="label">Expenses</div>
      <div class="value" id="totalExpense">0</div>
    </div>
    <div class="card remaining">
      <div class="label">Remaining</div>
      <div class="value" id="remaining">0</div>
    </div>
    <div class="card receivable">
      <div class="label">Owed to You</div>
      <div class="value" id="totalReceivable">0</div>
    </div>
  </div>

  <section class="panel">
    <h2>Income</h2>
    <div id="incomeRows"></div>
    <button class="add-btn" onclick="addRow('income')">+ Add income source</button>
    <div class="section-total"><span>Total</span><span id="incomeSectionTotal">0</span></div>
  </section>

  <section class="panel">
    <h2>Expenses</h2>
    <div id="expenseRows"></div>
    <button class="add-btn" onclick="addRow('expense')">+ Add expense</button>
    <div class="section-total"><span>Total</span><span id="expenseSectionTotal">0</span></div>
  </section>

  <section class="panel">
    <h2>Receivables (money owed to you)</h2>
    <div id="receivableRows"></div>
    <button class="add-btn" onclick="addRow('receivable')">+ Add receivable</button>
    <div class="section-total"><span>Total Owed</span><span id="receivableSectionTotal">0</span></div>
  </section>

  <div style="text-align:center;">
    <button class="reset-btn" onclick="resetAll()">Reset all data</button>
  </div>

  <footer>Currency: PKR · saved automatically in your browser</footer>
</div>

<script>
const DEFAULTS = {
  income: [
    {name:"Salary / Stipend", amount:0},
    {name:"Freelance / Side income", amount:0}
  ],
  expense: [
    {name:"Rent / Housing", amount:0},
    {name:"Groceries", amount:0},
    {name:"Utilities", amount:0},
    {name:"Internet / Phone", amount:0},
    {name:"Transport", amount:0},
    {name:"Savings", amount:0}
  ],
  receivable: [
    {name:"", amount:0, date:"", status:"Pending"}
  ]
};

let state = load();

function load(){
  try{
    const raw = localStorage.getItem('simpleBudgetData');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}

function save(){
  try{ localStorage.setItem('simpleBudgetData', JSON.stringify(state)); }catch(e){}
}

function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString(undefined,{maximumFractionDigits:0});
}

function render(){
  renderSection('income');
  renderSection('expense');
  renderReceivables();
  updateSummary();
}

function renderSection(kind){
  const container = document.getElementById(kind+'Rows');
  container.innerHTML = '';
  state[kind].forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <input type="text" value="${escapeHtml(item.name)}" placeholder="Name" data-idx="${idx}" data-kind="${kind}" data-field="name">
      <input type="number" value="${item.amount}" placeholder="0" data-idx="${idx}" data-kind="${kind}" data-field="amount">
      <button class="del" data-idx="${idx}" data-kind="${kind}" title="Remove">✕</button>
    `;
    container.appendChild(row);
  });
  container.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', onFieldChange);
  });
  container.querySelectorAll('button.del').forEach(btn => {
    btn.addEventListener('click', onDelete);
  });
}

function renderReceivables(){
  const kind = 'receivable';
  const container = document.getElementById('receivableRows');
  container.innerHTML = '';
  state.receivable.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'row receivable-row';
    const statuses = ['Pending','Paid','Overdue'];
    row.innerHTML = `
      <input type="text" value="${escapeHtml(item.name)}" placeholder="Who owes you?" data-idx="${idx}" data-kind="${kind}" data-field="name">
      <input type="number" value="${item.amount}" placeholder="0" data-idx="${idx}" data-kind="${kind}" data-field="amount">
      <input type="date" class="dateField" value="${item.date||''}" data-idx="${idx}" data-kind="${kind}" data-field="date">
      <select data-idx="${idx}" data-kind="${kind}" data-field="status">
        ${statuses.map(s=>`<option value="${s}" ${item.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <button class="del" data-idx="${idx}" data-kind="${kind}" title="Remove">✕</button>
    `;
    container.appendChild(row);
  });
  container.querySelectorAll('input,select').forEach(inp => {
    inp.addEventListener('input', onFieldChange);
  });
  container.querySelectorAll('button.del').forEach(btn => {
    btn.addEventListener('click', onDelete);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function onFieldChange(e){
  const {idx, kind, field} = e.target.dataset;
  const val = field === 'amount' ? (parseFloat(e.target.value)||0) : e.target.value;
  state[kind][idx][field] = val;
  save();
  updateSummary();
}

function onDelete(e){
  const {idx, kind} = e.target.dataset;
  state[kind].splice(idx,1);
  save();
  render();
}

function addRow(kind){
  if(kind === 'receivable'){
    state[kind].push({name:'', amount:0, date:'', status:'Pending'});
  } else {
    state[kind].push({name:'', amount:0});
  }
  save();
  render();
}

function updateSummary(){
  const incomeTotal = state.income.reduce((s,i)=>s+(Number(i.amount)||0),0);
  const expenseTotal = state.expense.reduce((s,i)=>s+(Number(i.amount)||0),0);
  const receivableTotal = state.receivable
    .filter(i => i.status !== 'Paid')
    .reduce((s,i)=>s+(Number(i.amount)||0),0);
  const remaining = incomeTotal - expenseTotal;

  document.getElementById('totalIncome').textContent = fmt(incomeTotal);
  document.getElementById('totalExpense').textContent = fmt(expenseTotal);
  document.getElementById('incomeSectionTotal').textContent = fmt(incomeTotal);
  document.getElementById('expenseSectionTotal').textContent = fmt(expenseTotal);
  document.getElementById('totalReceivable').textContent = fmt(receivableTotal);
  document.getElementById('receivableSectionTotal').textContent = fmt(receivableTotal);

  const remEl = document.getElementById('remaining');
  remEl.textContent = fmt(remaining);
  remEl.classList.remove('pos','neg');
  remEl.classList.add(remaining >= 0 ? 'pos' : 'neg');
}

function resetAll(){
  if(!confirm('Clear all budget data on this device?')) return;
  state = JSON.parse(JSON.stringify(DEFAULTS));
  save();
  render();
}

// theme toggle
function initTheme(){
  const saved = localStorage.getItem('simpleBudgetTheme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
}
document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : (current === 'light' ? '' : 'dark');
  if(next === ''){
    document.documentElement.removeAttribute('data-theme');
    localStorage.removeItem('simpleBudgetTheme');
  } else {
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('simpleBudgetTheme', next);
  }
});

try{ initTheme(); }catch(e){}
render();
</script>
</body>
</html>
